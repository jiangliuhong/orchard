<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快速执行 · Orchard</title>
<style>
:root{--background:#f4f4f6;--foreground:#1c1c21;--card:#fff;--border:#e3e3e8;--muted:#63636b;--primary:#4f46e5;--soft:#eeedfd;--danger:#c33d3d;color-scheme:light;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--foreground);background:var(--background)}
:root.dark{--background:#1a1a1e;--foreground:#ededf1;--card:#232327;--border:#38383f;--muted:#a1a1aa;--primary:#a5b4fc;--soft:#2b2c47;--danger:#f28b82;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--border);border-radius:6px;background:var(--card);padding:6px 9px;min-height:30px}button{cursor:pointer}button:hover{border-color:var(--primary)}button:disabled{opacity:.5;cursor:not-allowed} :focus-visible{outline:2px solid var(--primary);outline-offset:2px}.primary{background:var(--primary);color:var(--card);border-color:var(--primary)}.muted{color:var(--muted);font-size:12px}h1,h2,h3,p{margin:0}h1{font-size:16px}h2{font-size:14px}a{color:var(--primary)}.shell{display:grid;grid-template-columns:164px minmax(0,1fr);min-height:100vh}.nav{padding:20px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:8px}.brand{font-size:19px;font-weight:650;margin:0 10px 25px}.nav span{padding:9px 10px;color:var(--muted)}.nav .active{background:var(--soft);color:var(--primary);border-radius:6px}.nav footer{margin-top:auto;display:grid;gap:10px}.header{padding:17px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.title{display:flex;gap:12px;align-items:center}.notice{padding:7px 22px;background:var(--card);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}.workspace{min-height:calc(100vh - 111px)}.content{padding:16px 20px;min-width:0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.toolbar #search{flex:1;min-width:170px}.group-filter{max-width:245px;min-width:130px}.summary{display:flex;justify-content:space-between;gap:10px;margin:14px 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.card{border:1px solid var(--border);background:var(--card);border-radius:6px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:5px}.card:hover{border-color:var(--muted)}.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.card-heading{display:flex;align-items:center;gap:7px;min-width:0}.type-icon{color:var(--muted);font:13px ui-monospace,monospace;flex:none}.card-heading .name{flex:1;min-width:0}.name{text-align:left;border:0;background:transparent;padding:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:24px}.note{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:18px}.card-bottom{margin-top:3px;font-size:11px;min-height:28px}.card-bottom>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-bottom button{flex:none;min-height:26px;padding:3px 8px;font-size:12px}.error{color:var(--danger)}.empty{padding:60px 15px;text-align:center;grid-column:1/-1;color:var(--muted)}dialog{border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:10px;padding:0;width:min(540px,calc(100vw - 24px));max-height:90dvh;box-shadow:0 12px 36px #0002}dialog::backdrop{background:#0005}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}.dialog-body{padding:20px;overflow:auto}.dialog-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}label.field{display:grid;gap:5px;margin-bottom:13px}textarea{resize:vertical;min-height:70px;width:100%}pre,code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--background);padding:12px;border-radius:6px;font-size:12px}dl{display:grid;grid-template-columns:75px minmax(0,1fr);gap:12px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.detail-note{white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--foreground);color:var(--card);padding:10px 16px;border-radius:7px;max-width:90vw;z-index:5}#toast:empty{display:none}.check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0;white-space:nowrap}.check input{min-height:auto}.help{margin-top:22px;border-top:1px solid var(--border);padding-top:12px}.hidden{display:none!important}@media(min-width:1100px){#detail{margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:0;width:390px}}@media(max-width:850px){.shell{grid-template-columns:1fr}.nav{display:none}.header,.content{padding:14px}.title{gap:6px}}@media(max-width:600px){.group-filter{max-width:100%}.header{flex-wrap:wrap}.grid{grid-template-columns:minmax(0,1fr)}.toolbar>*{max-width:100%}.notice{padding:8px 14px}.row{display:block}.summary{flex-wrap:wrap}.title .muted{display:none}}
</style><link rel="stylesheet" href="prototype-extra.css"></head><body>
<div class="shell"><aside class="nav" aria-label="主导航示意"><div class="brand">♧ orchard</div><a href="#launch" data-page="launch" class="active">▦　快速执行</a><span>⑂　工作流</span><a href="#history" data-page="history">☷　运行记录</a><span>⌘　脚本库</span><span>◎　网页桥接</span><span>▤　字典</span><footer><label class="muted" for="theme">外观</label><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></footer></aside>
<main><header class="header"><div class="title"><h1 id="pageTitle">快速执行</h1><span class="muted" id="pageSubtitle">固定参数，一键启动</span></div><div><button id="mobileTheme" aria-label="切换浅色深色主题">◐ 主题</button> <button class="primary" id="create">＋ 新建快捷启动</button></div></header>
<nav class="page-tabs" aria-label="页面"><a href="#launch" data-page="launch">快速执行</a><a href="#history" data-page="history">运行记录</a></nav><div class="workspace" id="launchPage"><section class="content" aria-label="快捷启动卡片"><div class="toolbar"><div id="groupPicker" class="tree-picker"></div><label class="check"><input type="checkbox" id="descendants" checked>含子分组</label><input id="search" type="search" placeholder="搜索名称、备注、分组…" aria-label="搜索卡片"><select id="field" aria-label="搜索字段"><option value="all">全部属性</option><option value="name">仅名称</option><option value="note">仅备注</option><option value="group">仅分组路径</option></select><select id="type" aria-label="执行类型"><option value="">全部类型</option><option>工作流</option><option>脚本</option><option>浏览器工具</option></select><select id="availability" aria-label="可用性"><option value="">全部可用性</option><option value="ready">可执行</option><option value="blocked">不可用</option></select><button id="clear">清除筛选</button></div><div class="summary"><span id="count" aria-live="polite"></span><select id="sort" aria-label="排序"><option value="name">名称升序</option><option value="updated">最近更新</option></select></div><div id="grid" class="grid"></div></section></div><section id="historyPage" class="content hidden" aria-label="统一运行记录"><div class="toolbar"><input id="historySearch" type="search" aria-label="搜索运行记录" placeholder="搜索名称、目标或运行 ID"><select id="historyType" aria-label="运行类型"><option value="">全部类型</option><option>工作流</option><option>脚本</option><option>浏览器工具</option></select><select id="historySource" aria-label="运行来源"><option value="">全部来源</option><option>快速执行</option><option>工作流页面</option><option>脚本库</option><option>网页桥接</option></select><select id="historyStatus" aria-label="运行状态"><option value="">全部状态</option><option>运行中</option><option>成功</option><option>失败</option><option>已取消</option></select><button id="historyClear">清除筛选</button></div><p class="muted" id="historyCount" aria-live="polite"></p><div class="table-scroll"><table><thead><tr><th>名称 / 运行 ID</th><th>类型</th><th>来源</th><th>状态</th><th>开始时间</th><th>耗时</th><th>操作</th></tr></thead><tbody id="historyRows"></tbody></table></div></section></main></div>
<dialog id="detail" aria-labelledby="detailTitle"><div class="dialog-head"><h2 id="detailTitle">快捷启动详情</h2><button data-close="detail" aria-label="关闭详情">✕</button></div><div id="detailBody" class="dialog-body"></div><div class="dialog-footer"><button id="edit">编辑配置</button><button id="detailRun" class="primary">执行</button></div></dialog>
<dialog id="editor" aria-labelledby="editorTitle"><form id="form"><div class="dialog-head"><h2 id="editorTitle">新建快捷启动</h2><button type="button" data-close="editor" aria-label="关闭编辑">✕</button></div><div class="dialog-body"><label class="field">名称<input id="editName" required maxlength="80" placeholder="例如：每日销售汇总"></label><label class="field">备注<textarea id="editNote" maxlength="500" placeholder="说明用途和固定参数的适用场景"></textarea></label><div class="row"><div class="field"><span>分组</span><div id="editPicker" class="tree-picker"></div></div><label class="field">执行目标<select id="editTarget"></select></label></div><p class="muted">更换执行目标后，请重新核对参数。</p><label class="field">运行参数<textarea id="editInput" class="mono" rows="6" spellcheck="false">{}</textarea></label><p id="formError" class="error" role="alert"></p></div><div class="dialog-footer"><button type="button" data-close="editor">取消</button><button class="primary" type="submit">保存快捷启动</button></div></form></dialog><dialog id="runDetail" aria-labelledby="runTitle"><div class="dialog-head"><h2 id="runTitle">运行详情</h2><button data-close="runDetail" aria-label="关闭运行详情">✕</button></div><div id="runBody" class="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=['业务运营','业务运营 / 报表','业务运营 / 报表 / 每日','业务运营 / 订单','研发工具','研发工具 / 质量检查'];
const targets=[{type:'工作流',name:'sales-daily',version:'v3'},{type:'脚本',name:'health-check',version:'v2'},{type:'浏览器工具',name:'orders.export',version:'契约 a82f'}];
let items=[
['每日销售汇总','汇总华东区域数据，输出标准日报。','业务运营 / 报表 / 每日',0,{region:'east',format:'csv'},'成功 · 2 分钟前',''],
['订单导出 · 本月','使用当前登录页面导出已完成订单。','业务运营 / 订单',2,{status:'completed',period:'this_month'},'尚未执行',''],
['预发布环境检查','检查服务连通性与版本，适用于发布前核验。','研发工具 / 质量检查',1,{environment:'staging',timeout:30},'成功 · 18 分钟前',''],
['每周经营摘要','固定华北区域，汇总收入与退款指标。','业务运营 / 报表',0,{region:'north',period:'week'},'尚未执行',''],
['生产健康巡检','检查生产服务状态。','研发工具',1,{environment:'production'},'失败 · 请求超时',''],
['客户订单抓取','连接浏览器后抓取客户订单。','业务运营 / 订单',2,{limit:100},'尚未执行','浏览器未连接'],
['归档数据核对','核对归档数据的一致性。','',1,{mode:'verify'},'尚未执行','目标版本不可用'],
['每日销售汇总 · 华南跨境渠道','汇总直营网店、跨境电商及线下门店的销售数据。','业务运营 / 报表 / 每日',0,{region:'south',channels:['direct','cross-border','retail']},'成功 · 昨天',''],
['临时服务检查','常用基础检查，暂未归入分组。','',1,{environment:'local'},'尚未执行','']
].map((x,i)=>({id:i+1,name:x[0],note:x[1],group:x[2],target:x[3],input:x[4],status:x[5],reason:x[6],updated:i,busy:false}));
let chosen='*',selected=null,editing=null,timer;
$('editTarget').innerHTML=targets.map((t,i)=>`<option value="${i}">${t.type} · ${t.name} · ${t.version}</option>`).join('');
function selectGroup(g){chosen=g;updatePicker('groupPicker',g);render()}
function render(){const tokens=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);const out=items.filter(x=>{const t=targets[x.target],f=$('field').value,hay=(f==='all'?[x.name,x.note,x.group]:[x[f]]).join(' ').toLowerCase();return tokens.every(k=>hay.includes(k))&&(chosen==='*'||x.group===chosen||($('descendants').checked&&chosen&&x.group.startsWith(chosen+' / ')))&&(!$('type').value||t.type===$('type').value)&&(!$('availability').value||($('availability').value==='ready'?!x.reason:!!x.reason))}).sort((a,b)=>$('sort').value==='updated'?b.updated-a.updated:a.name.localeCompare(b.name,'zh-CN')||a.id-b.id);$('count').textContent=`${chosen==='*'?'全部快捷启动':chosen||'未分组'} · ${out.length} / ${items.length} 个`;$('grid').innerHTML=out.map(x=>{const t=targets[x.target];return `<article class="card"><div class="card-heading"><span class="type-icon" role="img" aria-label="${t.type}" title="${t.type}">${['⑂','⌘','◎'][x.target]}</span><button class="name" data-detail="${x.id}" title="${esc(x.name)}">${esc(x.name)}</button></div><p class="note" title="${esc(x.note||'暂无备注')}">${esc(x.note||'暂无备注')}</p><div class="card-bottom"><span class="${x.reason||x.status.startsWith('失败')?'error':''}">${esc(x.reason||x.status)}</span><button data-run="${x.id}" aria-label="执行 ${esc(x.name)}" ${x.reason||x.busy?'disabled':''}>${x.busy?'运行中…':'▶ 执行'}</button></div></article>`}).join('')||'<div class="empty"><h2>没有匹配的快捷启动</h2><p>调整关键词或清除筛选后再试。</p></div>'}
function detail(){const x=items.find(x=>x.id===selected),t=targets[x.target];$('detailBody').innerHTML=`<h2 style="overflow-wrap:anywhere">${esc(x.name)}</h2><p class="detail-note muted" style="margin-top:10px">${esc(x.note||'暂无备注')}</p><dl><dt>分组</dt><dd>${esc(x.group||'未分组')}</dd><dt>执行目标</dt><dd>${t.type} · ${t.name}</dd><dt>版本 / 契约</dt><dd>${t.version}</dd><dt>可用性</dt><dd class="${x.reason?'error':''}">${esc(x.reason||'可执行')}</dd><dt>最近执行</dt><dd>${esc(x.status)}</dd></dl><h2>固定参数</h2><pre>${esc(JSON.stringify(x.input,null,2))}</pre><h2>最近输出</h2><pre>${esc(x.output||'暂无执行输出')}</pre>`;$('detailRun').disabled=!!x.reason||x.busy;$('detailRun').textContent=x.busy?'运行中…':'▶ 执行'}
function toast(s){clearTimeout(timer);$('toast').textContent=s;timer=setTimeout(()=>$('toast').textContent='',3500)}
function run(id){const x=items.find(x=>x.id===id);if(x.busy||x.reason)return;x.busy=true;x.status='运行中…';const snapshot=JSON.stringify(x.input);const record=recordStart(x);render();if(selected===id)detail();setTimeout(()=>{x.busy=false;const fail=id===5;x.status=fail?'失败 · 请求超时':'成功 · 刚刚';x.output=fail?'请求超时，请检查目标环境后重试。':JSON.stringify({ok:true,input:JSON.parse(snapshot),message:'执行完成'},null,2);record.status=fail?'失败':'成功';record.finishedAt=Date.now();record.output=x.output;renderHistory();if($('runDetail').open)showRecord(activeRecord,false);render();if(selected===id)detail();toast(`${x.name}：${fail?'执行失败，请查看详情':'执行成功'}`)},1400)}
function openEditor(id=null){editing=id;const x=items.find(x=>x.id===id);$('editorTitle').textContent=x?'编辑快捷启动':'新建快捷启动';$('editName').value=x?.name||'';$('editNote').value=x?.note||'';updatePicker('editPicker',x?.group??(chosen==='*'?'':chosen));$('editTarget').value=x?.target??0;$('editInput').value=JSON.stringify(x?.input||{},null,2);$('formError').textContent='';$('editor').showModal();$('editName').focus()}
$('grid').onclick=e=>{const d=e.target.closest('[data-detail]'),r=e.target.closest('[data-run]');if(d){selected=Number(d.dataset.detail);detail();$('detail').showModal()}if(r)run(Number(r.dataset.run))};
for(const id of ['search','field','type','availability','sort','descendants'])$(id).addEventListener('input',render);
$('clear').onclick=()=>{$('search').value='';$('field').value='all';$('type').value='';$('availability').value='';$('descendants').checked=true;selectGroup('*')};
$('create').onclick=()=>openEditor();$('edit').onclick=()=>openEditor(selected);$('detailRun').onclick=()=>run(selected);
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$('form').onsubmit=e=>{e.preventDefault();let input;try{input=JSON.parse($('editInput').value);if(!input||Array.isArray(input)||typeof input!=='object')throw Error()}catch{$('formError').textContent='请输入有效 JSON 对象，例如 {"region":"east"}。';$('editInput').focus();return}if(!$('editName').value.trim()){$('formError').textContent='名称不能为空。';return}const data={name:$('editName').value.trim(),note:$('editNote').value.trim(),group:pickerValues.editPicker,target:Number($('editTarget').value),input,updated:Date.now()};if(editing){const x=items.find(x=>x.id===editing);Object.assign(x,data);if(x.reason==='目标版本不可用')x.reason=''}else items.push({...data,id:Math.max(...items.map(x=>x.id))+1,status:'尚未执行',reason:'',busy:false});$('editor').close();render();if(selected)detail();toast('已保存')};
const media=matchMedia('(prefers-color-scheme: dark)');function theme(){document.documentElement.classList.toggle('dark',$('theme').value==='dark'||($('theme').value==='system'&&media.matches))}$('theme').onchange=theme;media.addEventListener('change',theme);$('mobileTheme').onclick=()=>{$('theme').value=document.documentElement.classList.contains('dark')?'light':'dark';theme()};theme();render();
</script><script src="prototype-extra.js"></script><script src="prototype-parameters.js"></script><script src="prototype-groups.js"></script></body></html>
